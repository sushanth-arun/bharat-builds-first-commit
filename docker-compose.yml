services:
  # OpenSearch: Distributed search & vector database running locally
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: praapti-opensearch
    environment:
      - cluster.name=praapti-cluster
      - node.name=praapti-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - praapti-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenSearch Dashboards (Optional UI for data exploration)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.14.0
    container_name: praapti-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - praapti-network
    depends_on:
      opensearch:
        condition: service_healthy

  # LocalStack: Local emulation of AWS Cloud Services (S3, DynamoDB, Lambda, API Gateway)
  localstack:
    image: localstack/localstack:3.4.0
    container_name: praapti-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,dynamodb,lambda,apigateway,iam,sts
      - AWS_DEFAULT_REGION=ap-south-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=0
    volumes:
      - localstack-data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - praapti-network

networks:
  praapti-network:
    driver: bridge

volumes:
  opensearch-data:
  localstack-data:
